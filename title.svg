<svg xmlns="http://www.w3.org/2000/svg" width="1092" height="110" viewBox="0 0 1092 110" role="img" aria-label="Marius Pruvot">
  <style>
    text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
    .bg{fill:#15131c}
    .prompt{fill:#2de2e6;font-size:26px}
    .name{fill:#ff3ea5;font-size:46px;font-weight:700;letter-spacing:2px}
